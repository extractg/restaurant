<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link
        rel="icon"
        type="image/png"
        href="../assets/images/favicon.png"
    />
    <title>Products | Deliciora</title>
</head>
<body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a href="../index.html"
            ><img src="../assets/images/logo.png" alt="Logo" class="header__logo"
          /></a>
          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__items"><a href="../index.html" class="nav__link">Home</a></li>
              <li class="nav__items">
                <a href="products.html" class="nav__link">Products</a>
              </li>
              <li class="nav__items">
                <a href="favorites.html" class="nav__link">Favorites</a>
              </li>
              <li class="nav__items">
                <a href="../index.html#contacts" class="nav__link">Contacts</a>
              </li>
            </ul>
          </nav>
          <div class="header__actions">
            <a class="header__btn btn btn--secondary" href="profile.html">Profile</a>
              <button
                  class="burger"
                  id="burger"
                  type="button"
                  aria-label="Open menu"
                  aria-expanded="false"
              >
                  <span></span>
                  <span></span>
                  <span></span>
              </button>
          </div>
        </div>
      </div>
    </header>
    <main>
    <section class="products">
        <div class="container">

            <div class="products__header">
                <span class="products__label">Our Menu</span>

                <h1 class="products__title">
                    Discover Our Dishes
                </h1>

                <p class="products__text">
                    Explore our selection of carefully crafted dishes,
                    prepared with fresh ingredients and inspired by flavors
                    from around the world.
                </p>
            </div>

            <div class="products__controls">

                <div class="products__search">
                    <input
                        type="text"
                        class="products__search-input"
                        id="searchInput"
                        placeholder="Search dishes..."
                        autocomplete="off"
                    />

                    <button
                        class="products__search-button"
                        type="button"
                        aria-label="Search dishes"
                    >
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div class="products__categories">
                    <button
                        class="products__category active"
                        data-category="all"
                    >
                        All
                    </button>

                    <button
                        class="products__category"
                        data-category="Beef"
                    >
                        Beef
                    </button>

                    <button
                        class="products__category"
                        data-category="Chicken"
                    >
                        Chicken
                    </button>

                    <button
                        class="products__category"
                        data-category="Seafood"
                    >
                        Seafood
                    </button>

                    <button
                        class="products__category"
                        data-category="Dessert"
                    >
                        Dessert
                    </button>
                </div>

            </div>

            <div class="products__status" id="productsStatus"></div>

            <div class="products__grid" id="productsGrid">
                <!-- Блюда сюда будет добавлять JavaScript -->
            </div>

        </div>
    </section>
</main>
    <script src="../js/main.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/products.js"></script>
</body>
</html>
